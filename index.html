.quote-card{display:block;min-width:0;max-width:100%;padding:5px 8px;border-radius:6px;background:#00000023;color:inherit;text-align:left;white-space:normal;line-height:14px}
.quote-name,.quote-text{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.quote-name{font-weight:750}.quote-text{font-weight:500}.quote-reply{display:block;margin-top:5px}
.quote-pending .quote-card,.message-quote-editor .quote-card{flex:1}.quote-pending{flex-wrap:nowrap}
.message-quote-editor{display:flex;align-items:center;gap:8px;color:var(--text)}

/* Editor-only placeholders; real avatars and chat rendering stay unchanged. */
:is(.rail,#sheet,.sender-dock) .avatar.empty{color:var(--accent)}

/* Editor glyphs in the bottom composer may differ from the typing color. */
.chat .composer .composer-glyph{color:var(--bar-icon,var(--bar-ink))}

/* Replay leaves the chat styled as usual, with playback controls outside it. */
.replay-tools button{white-space:nowrap;min-height:44px}
.replay-status{min-height:46px;display:flex;align-items:center;padding:0 10px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chat-replaying .composer textarea{visibility:hidden;height:44px!important}
.chat-replaying #attachment-preview{display:none}
.chat-replaying .messages button{pointer-events:none}
@media(max-width:800px){.replay-tools button{font-size:11px;padding-inline:8px}}

.sheet-body .auto-edit-status[data-error="true"]{color:#ffb6c4}

/* Keep participant color settings compact without shrinking the text-entry fields. */
.sheet-title-row{display:flex;align-items:center;gap:9px}
.participant-header-delete{min-height:44px;padding:0 10px;font-size:12px;white-space:nowrap;flex:none}
.sheet-body form[data-form="participant"]{gap:8px}
.sheet-body [data-form="participant"] label.toggle{min-height:34px;font-size:12px}
.sheet-body [data-form="participant"] .participant-colors label{font-size:12px;gap:3px}
.sheet-body [data-form="participant"] .participant-colors input[type="color"]{min-height:34px;height:34px;padding:3px 5px}
.sheet-body [data-form="participant"] .presets{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;max-width:374px}
.sheet-body [data-form="participant"] .presets button{width:100%;height:36px}
.sheet-body [data-form="participant"] .presets button::before{width:18px;height:18px}
.sheet-body [data-form="participant"] .error:empty{display:none}

</style>
</head>
<body>
<div class="app-shell" id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-mark" data-icon="logo"></span><span>チャットノート</span><span class="brand-divider"></span><span class="brand-caption">CHAT GENERATOR</span></div>
      <span class="local-badge"><i></i>ローカルモード</span>
    </div>
  </header>
  <main class="workspace">
    <div class="project">
      <div>
        <div class="eyebrow"><span></span> CREATIVE WORKSPACE</div>
        <h1>チャットノート</h1>
        <p>架空の会話をつくって、画像に保存。</p>
      </div>
      <div class="project-tools" id="edit-tools">
        <button type="button" class="secondary workspace-button" data-action="workspaces"><span data-icon="folder"></span><span>作品</span></button>
      <button class="primary export-button" data-action="export"><span data-icon="download"></span><span>画像保存</span></button>
      </div>
      <div class="project-tools replay-tools" id="replay-tools" aria-label="再生操作" hidden>
        <button type="button" class="primary" data-action="replay-toggle" id="replay-toggle">一時停止</button>
        <button type="button" class="secondary" data-action="replay-stop">編集に戻る</button>
      </div>
    </div>
    <div class="studio-grid">
      <aside class="rail" aria-label="制作ツール">
        <section class="rail-card tool-card">
          <h2>編集ツール</h2>
          <button data-action="participants" class="tool"><span class="tool-icon violet" data-icon="users"></span><span><b>参加者管理</b><small>名前・アイコン・吹き出し</small></span><span class="chev" data-icon="chevron"></span></button>
          <button data-action="settings" class="tool"><span class="tool-icon pink" data-icon="palette"></span><span><b>デザイン設定</b><small>背景・文字・表示オプション</small></span><span class="chev" data-icon="chevron"></span></button>
          <button data-action="story-add" class="tool"><span class="tool-icon violet" data-icon="book"></span><span><b>地の文</b><small>地の文・斜体・センタリングを追加</small></span><span class="chev" data-icon="chevron"></span></button>
        </section>
        <section class="rail-card theme-card"><h2>チャットテーマ</h2><div id="rail-themes"></div></section>
        <section class="rail-card member-card">
          <div class="section-head"><h2>参加者 <span id="rail-total" class="count-label"></span></h2><button class="rail-add icon-btn" aria-label="参加者を追加" title="参加者を追加" data-action="participant-new" data-icon="plus"></button></div>
          <div id="rail-members" class="rail-members"></div>
        </section>
        <div class="tip-card"><span class="tip-icon" data-icon="bulb"></span><div><b>ワンポイント</b><p>吹き出しをタップすると、投稿を編集できます。</p></div></div>
      </aside>
      <div class="preview-col">
      <section class="chat" aria-label="グループチャット編集">
        <header class="chat-head" id="chat-head">
          <button class="chat-back icon-btn" data-action="menu" data-icon="back" aria-label="編集ツールを開く"></button>
          <button class="group-icon icon-btn" data-action="settings" data-icon="users" aria-label="グループの設定"></button>
          <button class="group-meta" data-action="settings"><strong id="group-name"></strong><small id="group-count"></small></button>
          <div class="dm-head-icons" aria-hidden="true"><span data-icon="dm-phone"></span><span data-icon="dm-video"></span></div>
          <button class="chat-menu icon-btn" data-action="menu" data-icon="dots" aria-label="チャットメニュー"></button>
        </header>
        <div id="chat-scroll" class="chat-scroll" tabindex="0" aria-label="会話履歴"><div id="messages" class="messages"></div></div>
        <form id="composer" class="composer" aria-label="メッセージ入力">
          <div id="attachment-preview" hidden></div>
          <div class="composer-row">
            <div class="composer-tools">
              <button type="button" class="composer-glyph icon-btn" data-action="menu" data-icon="bars" aria-label="編集ツール"></button>
              <button type="button" class="attach composer-glyph icon-btn" data-action="attach" data-icon="chevron" aria-label="画像・スタンプを添付"></button>
            </div>
            <div class="compose-field">
              <textarea id="message-input" aria-label="メッセージ" enterkeyhint="enter" rows="1"></textarea>
              <button type="button" class="composer-glyph icon-btn" data-action="stickers" data-icon="smile" aria-label="スタンプ一覧"></button>
            </div>
            <button type="button" id="send" class="send composer-glyph icon-btn" aria-label="送信" data-icon="send"></button>
          </div>
        </form>
      </section>
      <div id="sender-dock" class="sender-dock">
        <span>発言者 <small>編集用</small></span>
        <button type="button" class="speaker" data-action="speaker" aria-label="発言者・表情を選択" id="speaker"></button>
        <div class="dock-actions" aria-label="小説・投稿編集">
          <button type="button" class="secondary story-button" data-action="story-add"><span data-icon="book"></span><span>地の文</span></button>
          <button type="button" class="secondary timeline-button" data-action="timeline"><span data-icon="edit"></span><span>編集</span></button>
        </div>
      </div>
      <div id="replay-status" class="replay-status" role="status" aria-live="polite" hidden></div>
      </div>
    </div>
    <footer class="footer"><span><span data-icon="shield"></span><span>会話と画像はこの端末内でのみ処理されます</span></span><span class="footer-brand">チャットノート</span></footer>
  </main>
</div>
<dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-grip"></div><header class="sheet-head"><div><div class="eyebrow"><span></span> チャットノート</div><div class="sheet-title-row"><h2 id="sheet-title" tabindex="-1"></h2><button type="button" class="danger participant-header-delete" id="participant-header-delete" data-action="participant-delete" aria-label="参加者を削除" hidden>削除</button></div></div><button class="icon-btn close-sheet" data-action="close" data-icon="close" aria-label="閉じる"></button></header><div id="sheet-body" class="sheet-body"></div></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="attachment-file" accept="image/png,image/jpeg,image/webp" hidden>
